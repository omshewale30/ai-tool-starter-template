# Local development stack for {{ cookiecutter.project_name }}.
# Runs the frontend, backend, and a SQL Server database with mock AI + disabled
# auth so the app works with no real Azure dependencies.
#
#   docker compose up --build
#
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-Your_password123}"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./api
    command: >
      /bin/bash -lc "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: local
      AI_PROVIDER: "${AI_PROVIDER:-mock}"
      AUTH_MODE: "${AUTH_MODE:-disabled}"
      DATABASE_URL: "mssql+pyodbc://sa:${SQL_SA_PASSWORD:-Your_password123}@db:1433/master?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      ENTRA_BACKEND_CLIENT_ID: "${ENTRA_BACKEND_CLIENT_ID:-}"
      ENTRA_BACKEND_APP_ID_URI: "${ENTRA_BACKEND_APP_ID_URI:-}"
      ADMIN_GROUP_ID: "${ADMIN_GROUP_ID:-}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # The web app runs `next dev` here, not the production image: sign-in can only be
  # disabled at build time (NEXT_PUBLIC_AUTH_DISABLED), and the published image is
  # always built with it off. `scripts/smoke.sh` exercises the production image.
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"
    environment:
      BACKEND_ORIGIN: "http://api:8000"
      NEXT_PUBLIC_AUTH_DISABLED: "${NEXT_PUBLIC_AUTH_DISABLED:-true}"
      ENTRA_CLIENT_ID: "${ENTRA_CLIENT_ID:-}"
      ENTRA_TENANT_ID: "${ENTRA_TENANT_ID:-}"
      ENTRA_API_SCOPE: "${ENTRA_API_SCOPE:-}"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  web_node_modules:
