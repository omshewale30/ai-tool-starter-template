# Optional local hooks: `pipx install pre-commit && pre-commit install`.
# CI runs the same checks through scripts/ci.sh, so these only catch issues sooner.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^api/
      - id: ruff-format
        files: ^api/
  - repo: local
    hooks:
      - id: eslint
        name: eslint (web)
        entry: npm --prefix web run lint
        language: system
        files: ^web/.*\.(ts|tsx|js|mjs)$
        pass_filenames: false
      - id: api-types
        name: web API types are current
        entry: bash -c 'npm --prefix web run generate:api >/dev/null && git diff --exit-code -- web/src/lib/api/schema.ts'
        language: system
        files: ^api/app/
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^\.github/workflows/
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
