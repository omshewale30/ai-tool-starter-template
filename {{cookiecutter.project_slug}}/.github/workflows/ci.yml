# cd.yml triggers on `workflow_run` of this workflow by name; keep it `CI`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every check is `bash scripts/ci.sh <name>`; the script sets its own test-only
  # environment. Reports as `checks / backend`, `checks / frontend`.
  checks:
    # Pinned by full SHA (FO-AI/automation v2 interface). Bump ci.yml and cd.yml together.
    uses: FO-AI/automation/.github/workflows/reusable-ci.yml@2b57fa6020a4be6f65b3c910e2756689b937395a
    with:
      checks: >-
        [{"name":"backend","directory":".","python-version":"3.11",
          "install":"python -m pip install -e './api[dev]'",
          "run":"bash scripts/ci.sh backend"},
         {"name":"frontend","directory":".","python-version":"3.11","node-version":"22",
          "install":"python -m pip install -e './api[dev]' && npm --prefix web ci",
          "run":"bash scripts/ci.sh frontend"}]
      # PR-time "does it still build" check. Never pushes; `publish` does that on main.
      # No build args: this builds exactly what ships.
      containers: >-
        [{"name":"api","context":"api","file":"api/Dockerfile"},
         {"name":"web","context":"web","file":"web/Dockerfile"}]

  # Documented exception to the reusable call: Playwright needs browsers installed and
  # uploads its report from the same runner when a test fails.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          python -m pip install -e './api[dev]'
          npm --prefix web ci
          (cd web && npx playwright install --with-deps chromium)
      - name: Playwright (real API behind a production web build)
        env:
          PYTHON: python
        run: npm --prefix web run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # The single required status check.
  verify:
    if: always()
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize required checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          {
            echo "### CI verification"
            echo ""
            echo "| job | result |"
            echo "|---|---|"
            echo "| checks | $CHECKS_RESULT |"
            echo "| e2e | $E2E_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CHECKS_RESULT" != success || "$E2E_RESULT" != success ]]; then
            echo "::error::One or more required CI jobs did not succeed"
            exit 1
          fi

  # Push to main only, and the only job in this workflow with cloud access.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # No environment is declared, so the OIDC subject is the main-ref form and only
      # repository (and organization) variables are readable here.
      - name: Validate Azure OIDC configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_NAME; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Set %s as a repository or organization variable; publish runs outside the dev environment.\n' "$name"
              exit 1
            fi
          done

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Builds run in ACR Tasks; the runner then pulls the pushed digests and
      # smoke-tests them together (scripts/smoke.sh).
      - name: Build, publish, and smoke-test images
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX }}
        run: bash scripts/publish.sh
