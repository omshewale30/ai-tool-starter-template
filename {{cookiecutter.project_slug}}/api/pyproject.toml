[project]
name = "{{ cookiecutter.python_package_name }}-api"
version = "0.1.0"
description = "{{ cookiecutter.project_description }} — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-json-logger>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # PostgreSQL driver (Azure Database for PostgreSQL Flexible Server)
    "psycopg[binary]>=3.2",
    # JWT validation for Microsoft Entra ID
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    # Azure SDKs (managed identity / keyless where possible)
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
    # Azure OpenAI / AI Foundry (services/ai/foundry_provider.py)
    "openai>=2.0",
{%- if cookiecutter.enable_ai_search == "yes" %}
    # Azure AI Search retrieval for RAG (services/search)
    "azure-search-documents>=11.6",
{%- endif %}
    # Observability
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "azure-monitor-opentelemetry>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["app/tests"]
